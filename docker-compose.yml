services:
  # PHP Backend (Laravel)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_app
    restart: always
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  # Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: backend_webserver
    restart: always
    ports:
      - '8000:80'
    volumes:
      - .:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # Database (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: backend_mysql
    restart: always
    ports:
      - '3307:3306'
    environment:
      MYSQL_DATABASE: db_portal
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_backend_data:/var/lib/mysql

  # MinIO (S3-compatible Object Storage)
  minio:
    image: minio/minio:latest
    container_name: backend_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:alpine
    container_name: backend_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_backend_data:
    external: true
    name: projek-portal_mysql_portal_data
  minio_data:
  redis_data:
